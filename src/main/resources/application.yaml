server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties]   # solo para correr desde el IDE
  application:
    name: ms-vidasalud-appointments

  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID}
        credential:
          client-id: ${AZURE_CLIENT_ID}
        app-id-uri: ${AZURE_APP_ID_URI:api://${AZURE_CLIENT_ID}}

  mvc:
    problemdetails:
      enabled: true
    apiversion:
      use:
        path-segment: 1   # /api/{version}/...
      supported: 1

  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}
    username: ${DB_USERNAME:vidasalud}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    # Nodos del clúster RabbitMQ (host:puerto separados por coma). Si el nodo actual cae,
    # el cliente se reconecta al siguiente de la lista.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USER:vidasalud}
    password: ${RABBITMQ_PASS}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
  level:
    "[org.hibernate.SQL]": DEBUG